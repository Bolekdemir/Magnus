<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magnus</title>
<meta name="description" content="Play and review chess games with plain-language explanations of every move.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@400..700&display=swap">
<link rel="stylesheet" href="css/pieces.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="bg" aria-hidden="true"><div class="bg-glow"></div><div class="bg-grid"></div><div class="bg-ghost g1 pc-bN"></div><div class="bg-ghost g2 pc-bR"></div><div class="bg-ghost g3 pc-bQ"></div><div class="bg-grain"></div></div>
<header class="topbar">
  <div class="topbar-in">
    <a href="#" class="brand" data-view="home" aria-label="Magnus home"><span class="brand-mark"><span class="pc pc-wN"></span></span><span class="brand-name">Magnus</span></a>
    <nav class="nav" aria-label="Main">
      <a href="#play" data-view="play">Play</a>
      <a href="#review" data-view="review">Review</a>
      <a href="#import" data-view="import">Import</a>
    </nav>
    <div class="tb-actions"></div>
  </div>
</header>
<main>
  <section class="view" id="v-home"></section>
  <section class="view" id="v-play" hidden></section>
  <section class="view" id="v-review" hidden></section>
  <section class="view" id="v-import" hidden></section>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
